<svg width="512" height="512" viewBox="0 0 512 512" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradients -->
    <linearGradient id="frameGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9B8FF"/>
      <stop offset="100%" stop-color="#6A4BCF"/>
    </linearGradient>

    <linearGradient id="visorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A2A63"/>
      <stop offset="100%" stop-color="#1F143D"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FF3FF"/>
      <stop offset="100%" stop-color="#3AD6E8"/>
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <rect x="248" y="48" width="16" height="48" rx="8" fill="#9C7BFF"/>
  <circle cx="256" cy="40" r="16" fill="#B99AFF"/>

  <!-- Side Ears -->
  <rect x="72" y="176" width="48" height="128" rx="24" fill="#4B347F"/>
  <rect x="392" y="176" width="48" height="128" rx="24" fill="#4B347F"/>

  <!-- Head Frame -->
  <rect x="96" y="128" width="320" height="256" rx="64"
        fill="url(#frameGradient)"/>

  <!-- Inner Visor -->
  <rect x="128" y="160" width="256" height="176" rx="48"
        fill="url(#visorGradient)"/>

  <!-- Eyes -->
  <circle cx="208" cy="248" r="20" fill="url(#accentGradient)"/>
  <circle cx="304" cy="248" r="20" fill="url(#accentGradient)"/>

  <!-- Smile -->
  <path d="M220 296
           Q256 320 292 296"
        stroke="url(#accentGradient)"
        stroke-width="12"
        stroke-linecap="round"
        fill="none"/>

</svg>
